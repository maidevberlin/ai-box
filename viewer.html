<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Box</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f2ee; --panel: #ffffff; --soft: #f1efe9; --text: #1d2126; --muted: #6c7480; --line: #e2dfd6;
    --accent: #2f6fed; --on-accent: #ffffff; --tint: #e8effd; --gold: #d99a00; --live: #1f9d55; --stop: #d9482b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1114; --panel: #161a1f; --soft: #1e232a; --text: #e7e9ec; --muted: #8b95a1; --line: #272d35;
      --accent: #6ea8fe; --on-accent: #0b1220; --tint: #1b2a44; --gold: #f2c14e; --live: #4ade80; --stop: #ff6b4a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif;
         height: 100vh; display: grid; grid-template-columns: 272px minmax(0, 1fr) 400px; gap: 12px; padding: 12px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 0; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--soft); border: 0;
          color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; }
  button.chip { color: var(--accent); text-decoration: underline; }
  .stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
  .stars i { font-style: normal; opacity: .28; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none;
         animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ---- left: the runs ---- */
  #sidebar { display: flex; flex-direction: column; padding: 14px 10px 10px; }
  #brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; padding: 0 6px 12px; }
  #brand span { width: 16px; height: 16px; border-radius: 4px; border: 3px solid var(--accent); }
  #new { border: 0; border-radius: 10px; padding: 9px; background: var(--accent); color: var(--on-accent);
         font-weight: 600; margin: 0 4px 12px; }
  #runs { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .run { text-align: left; border: 0; background: none; border-radius: 10px; padding: 9px 10px; width: 100%; }
  .run:hover { background: var(--soft); }
  .run.on { background: var(--tint); }
  .run .name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .run .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .facts { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .run .facts .when { margin-left: auto; }

  /* ---- middle: the world ---- */
  #stage { display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  #title { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #summary { margin: 4px 0 0; color: var(--muted); max-width: 78ch; }
  #usage { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #usage:empty { display: none; }
  #view { flex: 1; min-height: 240px; position: relative; border-radius: 12px; overflow: hidden; background: var(--soft); }
  #scene, #scene canvas { position: absolute; inset: 0; }
  #scene pre { margin: 0; padding: 16px; height: 100%; overflow: auto; font-size: 12px; }
  #status { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  #status .chip, #hint { background: color-mix(in srgb, var(--panel) 82%, transparent); color: var(--text); }
  #hint { position: absolute; right: 10px; top: 10px; pointer-events: none; opacity: .75; }
  #hint:empty { display: none; }
  /* The notes lying in the world: a button on the drawing, and a panel that opens from it. */
  #notesButton { position: absolute; left: 10px; top: 10px; padding: 4px 10px; text-decoration: none; cursor: pointer;
                 background: color-mix(in srgb, var(--panel) 82%, transparent); color: var(--text); }
  #notes { position: absolute; left: 10px; top: 42px; width: min(380px, calc(100% - 20px)); max-height: calc(100% - 96px);
           overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 6px 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
  #notes .note { padding: 8px 0; border-bottom: 1px solid var(--line); }
  #notes .note:last-child { border: 0; }
  #notes .where { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  #notes .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* What a world is and how it works: covers the drawing while it is open. */
  #about { position: absolute; inset: 0; overflow-y: auto; background: var(--panel); padding: 22px 26px;
           border: 1px solid var(--line); border-radius: 12px; }
  #about > * { max-width: 74ch; }
  #about h2 { margin: 0 0 10px; font-size: 18px; }
  #about h3 { margin: 22px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  #about p, #about ul { margin: 0 0 10px; }
  #about ul { padding-left: 20px; }
  #about li { margin-bottom: 4px; }
  #about dt { font-family: ui-monospace, monospace; font-size: 13px; margin-top: 10px; }
  #about dd { margin: 2px 0 0 0; }
  #about .quiet { color: var(--muted); font-size: 12.5px; }
  #about .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  #controls { display: flex; gap: 8px; align-items: center; }
  #controls button { border: 1px solid var(--line); background: var(--panel); border-radius: 50%;
                     width: 34px; height: 34px; padding: 0; flex: none; }
  #controls #play { width: 40px; height: 40px; background: var(--accent); color: var(--on-accent); border: 0; }
  #slider { flex: 1; accent-color: var(--accent); }
  #count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }

  /* ---- right: the conversation ---- */
  #side { display: flex; flex-direction: column; padding: 8px; }
  #state { display: flex; align-items: center; gap: 8px; padding: 8px 8px 10px; font-weight: 600; }
  #log { position: relative; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 0 4px 8px; }
  .empty { color: var(--muted); padding: 24px 10px; text-align: center; margin: auto; }
  .choice { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 22px; }
  .choice button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 8px 18px; font-weight: 600; }
  .choice button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .step { padding: 8px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
  .step.now { border-color: var(--accent); }
  .step .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .step .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .step.prompt { background: var(--tint); align-self: flex-end; max-width: 92%; border-bottom-right-radius: 4px; }
  .step.say { background: var(--soft); align-self: flex-start; max-width: 96%; border-bottom-left-radius: 4px; }
  .step.think { padding-top: 4px; padding-bottom: 4px; }
  .step.think .text { color: var(--muted); font-style: italic; }
  .step.act { padding-top: 5px; padding-bottom: 5px; }
  .step.act .call { font-family: ui-monospace, monospace; font-size: 12.5px; }
  .step.act .text { color: var(--muted); font-size: 12.5px; }
  .step.stop, .step.memory { text-align: center; color: var(--muted); font-size: 12.5px; }
  .step.death { text-align: center; color: var(--stop); font-weight: 600; border-top: 1px dashed var(--stop); border-radius: 0; margin-top: 8px; }

  /* The one place to tell the agent something: its first prompt when a run is new, later
     whatever comes next. The field starts out holding the prompt, so sending it unchanged
     repeats the prompt. */
  #composer { border-top: 1px solid var(--line); padding: 10px 4px 2px; }
  #box { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 22px;
         padding: 4px 4px 4px 14px; background: var(--bg); }
  #box:focus-within { border-color: var(--accent); }
  #say { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 6px 0; }
  #send { border: 0; border-radius: 18px; min-width: 36px; height: 36px; padding: 0 14px; flex: none;
          background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #send.square { background: var(--stop); color: #fff; padding: 0; }
  #options { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 6px 4px; color: var(--muted); font-size: 12.5px; }
  #limit { flex-basis: 100%; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #limit[hidden] { display: none; }
  #keep { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 2px 8px; }
  #options label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
  /* the checkbox, drawn as a switch */
  #auto { appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--line); margin: 0;
          position: relative; flex: none; cursor: pointer; transition: background .15s; }
  #auto::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%;
                 background: var(--panel); transition: left .15s; }
  #auto:checked { background: var(--accent); }
  #auto:checked::after { left: 14px; }
  #minutes { width: 54px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 2px 6px; }
  #stop { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 2px; }

  @media (max-width: 1000px) {
    body { height: auto; grid-template-columns: minmax(0, 1fr); }
    #runs { flex-direction: row; overflow-x: auto; }
    .run { min-width: 200px; }
    #view { min-height: 60vw; }
    #side { max-height: 80vh; }
  }
</style>
<!-- Worlds drawn in 3D use three.js, loaded from the internet. -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
  <nav class="panel" id="sidebar" aria-label="Runs">
    <div id="brand"><span></span>AI Box</div>
    <button id="new">+ New run</button>
    <div id="runs"></div>
  </nav>

  <main class="panel" id="stage">
    <header>
      <h1 id="title"></h1>
      <p id="summary"></p>
      <div id="usage"></div>
    </header>
    <div id="view">
      <div id="scene"></div>
      <div id="status"></div>
      <div id="hint" class="chip"></div>
      <button id="notesButton" class="chip" hidden></button>
      <div id="notes" hidden></div>
      <div id="about" hidden></div>
    </div>
    <div id="controls">
      <button id="play" aria-label="Play">▶</button>
      <button id="back" aria-label="Step back">‹</button>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="Step">
      <button id="forward" aria-label="Step forward">›</button>
      <span id="count"></span>
    </div>
  </main>

  <section class="panel" id="side" aria-label="Conversation">
    <div id="state"></div>
    <div id="log"></div>
    <form id="composer" hidden>
      <div id="box">
        <input id="say" aria-label="What the agent is told" autocomplete="off">
        <button id="send">Send</button>
      </div>
      <div id="options">
        <label><input type="checkbox" id="auto"> Keep it going whenever it stops</label>
        <button type="button" id="stop">End run</button>
        <!-- How: what the agent is told each time it stops, and for how long. -->
        <div id="limit" hidden>
          by telling it <input id="keep" aria-label="What the agent is told whenever it stops" autocomplete="off"
                               title="{day}, {time} and {date} are filled in. {countdown:10} counts down from 10 and ends the run at 0.">
          for <input id="minutes" type="number" min="1" placeholder="∞" aria-label="Minutes until the run ends"> min
        </div>
      </div>
    </form>
  </section>

<script type="module">
// This page knows nothing about any particular world. What a world is comes from the
// server (/api/runs), and how it is drawn from the file /worlds/<name>.js.

const $ = id => document.getElementById(id);
const SPEED = 900;        // milliseconds per step while playing
const POLL = 1000;        // how often a live run is re-read
const LIST = 4000;        // how often the list of runs is re-read

let story = null;         // the run on screen, as delivered by /api/runs/<id>
let at = 0;               // index of the step on screen
let playing = false;
let draft = false;        // a new run is being written and has not started
let lastPrompt = '';      // what the newest run was told: the suggestion for a new one
let worlds = [];          // every world there is, with its description and tools
let agents = [];          // the models a new run can use
let chosen = { world: '', agent: '' };   // picked for the new run
let aboutOpen = false;    // the "about this world" panel is open over a run
let notesOpen = false;    // the panel with the notes lying in the world is open
let painter = null;       // what draws the current world (from /worlds/<name>.js)
let paints = null;        // ... and the name of the world it draws

const api = (path, options) => fetch(path, options).then(r => r.json());

function el(tag, className, ...content) {
  const node = document.createElement(tag);
  node.className = className;
  node.append(...content.filter(part => part !== false && part != null));
  return node;
}

// The reviewer rates from 1 to 5: full stars, then faded ones.
const stars = n => el('span', 'stars', '★'.repeat(n), el('i', '', '★'.repeat(5 - n)));

// A run's id is its start time: 20261121-185331
function started(id) {
  const [, y, mo, d, h, mi] = id.match(/(....)(..)(..)-(..)(..)/);
  const date = new Date(y, mo - 1, d, h, mi);
  const today = date.toDateString() === new Date().toDateString();
  return date.toLocaleString([], today ? { hour: '2-digit', minute: '2-digit' }
    : { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

const worldInfo = name => worlds.find(world => world.name === name);
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);
const lasted = s => s < 90 ? `${s} s` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;

// ---------------------------------------------------------------- data

// The list of runs on the left: name and rating (once reviewed), which agent it was, when it started.
async function listRuns() {
  const answer = await api('/api/runs');
  ({ worlds, models: agents, prompt: lastPrompt } = answer);
  chosen.world ||= worlds[0]?.name;
  chosen.agent ||= agents[0];
  const cards = answer.runs.map(({ id, review, model, world, done, seconds }) => {
    const name = el('div', 'name', !done && el('i', 'dot'),
                    el('span', '', review ? review.name : done ? 'Not reviewed yet' : 'Running'));
    const facts = el('div', 'facts', review && stars(review.rating),
                     worlds.length > 1 && el('span', 'chip', worldInfo(world)?.title || world),
                     model && el('span', 'chip', model.split('-')[0]),   // "opus" is enough here
                     el('span', 'when', `${started(id)} · ${lasted(seconds)}`));
    const card = el('button', 'run' + (!draft && story?.id === id ? ' on' : ''), name, facts);
    card.onclick = () => select(id);
    return card;
  });
  if (draft) cards.unshift(el('button', 'run on', el('div', 'name', el('span', '', 'New run')),
                              el('div', 'facts', 'not started yet')));
  $('runs').replaceChildren(...cards);
  return answer.runs;
}
setInterval(listRuns, LIST);

async function loadRuns(pick) {
  const runs = await listRuns();
  if (pick || runs[0]) await select(pick || runs[0].id);
  else newRun();
}

async function select(id) {
  playing = draft = aboutOpen = false;
  $('say').value = '';
  await show(id);
  listRuns();
}

async function show(id, step = 0) {
  const fresh = await api('/api/runs/' + id);
  if (!fresh.steps) return;   // no such run
  story = fresh;
  at = Math.min(step, Math.max(story.steps.length - 1, 0));
  if (story.world) await paintWith(story.world);
  draw(true);
}

// Live runs grow: re-read the run on screen until it is done.
setInterval(async () => {
  if (!story || story.done) return;
  const fresh = await api('/api/runs/' + story.id);
  if (fresh.world && !story.world) await paintWith(fresh.world);   // the world has just started
  // Anything new? More steps, a step that finished, or the agent stopping or going on.
  const mark = s => JSON.stringify([s.done, s.waiting, s.auto, s.queued, s.steps?.length, s.steps?.at(-1)]);
  if (fresh.id === story.id && mark(fresh) !== mark(story)) { story = fresh; draw(); }
  if (fresh.done) listRuns();   // the finished run now has a name
}, POLL);

// Playing: one step forward per tick. At the end of a live run, wait for more.
setInterval(() => {
  if (!playing || !story || draft) return;
  if (at < story.steps.length - 1) { at++; draw(); }
  else if (story.done) { playing = false; draw(); }
}, SPEED);

// ---------------------------------------------------------------- the world

// Every world brings its own drawing. One without a drawing is shown as plain text.
async function paintWith(name) {
  if (paints === name) return;
  painter?.remove();
  paints = name;
  try {
    const drawing = await import(`/worlds/${name}.js`);
    painter = drawing.create($('scene'));
    $('hint').textContent = drawing.hint || '';
  } catch {
    const page = el('pre', '');
    $('scene').append(page);
    painter = { show: (story, step) => { page.textContent = JSON.stringify(step.state, null, 1); },
                facts: () => [], remove: () => page.remove() };
    $('hint').textContent = '';
  }
}

// What a world is and how it works, for people: its description, what the agent can do
// in it, and its settings (for a run: the ones that run had).
function aboutWorld(info, setup) {
  if (!info) return el('p', 'quiet', 'Nothing is written about this world.');
  const parts = [el('h2', '', info.title)];
  for (const block of info.about.trim().split(/\n\s*\n/)) {
    const tidy = text => text.replace(/\s+/g, ' ');
    if (block.startsWith('- ')) parts.push(el('ul', '', ...block.split(/\n(?=- )/).map(item => el('li', '', tidy(item.slice(2))))));
    else parts.push(el('p', '', tidy(block)));
  }
  const note = p => p.enum ? p.enum.join(' · ') : p.description
    || [p.type, p.minimum != null && `from ${p.minimum}`, p.maximum != null && `to ${p.maximum}`].filter(Boolean).join(' ');
  parts.push(
    el('h3', '', 'What the agent can do'),
    el('p', 'quiet', 'The agent is told its prompt and exactly this list: names, descriptions and parameters. Nothing else.'),
    el('dl', '', ...info.tools.flatMap(tool => [
      el('dt', '', `${tool.name}(${tool.parameters.map(p => p.name + (p.required ? '' : '?')).join(', ')})`),
      el('dd', '', tool.description,
         ...tool.parameters.map(p => el('div', 'quiet', `${p.name}: ${note(p)}`)))])),
    el('h3', '', setup ? 'Settings of this run' : 'Settings'),
    el('div', 'chips', ...Object.entries(info.settings)
      .filter(([key]) => !setup || key in setup)
      .map(([key, usual]) => el('span', 'chip', `${key} ${(setup ? setup[key] : usual) ?? 'random'}`))));
  return el('div', '', ...parts);
}

let aboutShows = null;   // what the panel was built for, so it is not rebuilt (and scrolled up) on every update
function drawAbout() {
  const name = draft ? chosen.world : story?.world;
  $('about').hidden = !(draft || aboutOpen);
  const key = name + (draft ? '' : story?.id);
  if ($('about').hidden || aboutShows === key) return;
  aboutShows = key;
  $('about').replaceChildren(aboutWorld(worldInfo(name), draft ? null : story.setup));
  $('about').scrollTop = 0;
}

// ---------------------------------------------------------------- page

function draw(newRun = false) {
  drawComposer();
  drawAbout();
  if (draft) {
    $('title').replaceChildren('New run');
    $('summary').textContent = 'A fresh world with a new agent in it.';
    $('status').replaceChildren();
    $('usage').replaceChildren();
    $('count').textContent = '';
    $('log').replaceChildren(choices());
    return;
  }
  const steps = story.steps, step = steps[at], r = story.review, info = worldInfo(story.world);
  const about = el('button', 'chip', aboutOpen ? 'Back to the run' : `About this world: ${info?.title || story.world || '…'}`);
  about.onclick = () => { aboutOpen = !aboutOpen; draw(); };
  $('title').replaceChildren(...[r ? r.name : story.done ? 'Not reviewed yet' : 'Running',
    r && stars(r.rating), story.model && el('span', 'chip', story.model),
    el('span', 'chip', started(story.id)), about].filter(Boolean));
  $('summary').textContent = r ? r.summary : story.done ? '' : 'This run gets a name and a summary when it ends.';
  $('usage').replaceChildren(...usageChips(story.usage));
  $('slider').max = Math.max(steps.length - 1, 0);
  $('slider').value = at;
  $('play').textContent = playing ? '❚❚' : '▶';
  $('play').ariaLabel = playing ? 'Pause' : 'Play';
  $('count').textContent = steps.length ? `${at + 1} / ${steps.length}` : '';
  if (step?.state && painter) painter.show(story, step, at, newRun);
  // A round is one message to the agent and everything it does in answer.
  const round = upTo => steps.slice(0, upTo + 1).filter(s => s.kind === 'prompt').length;
  $('status').replaceChildren(...(!step ? ['Waiting for the world to start…']
    : [`round ${round(at)} of ${round(steps.length)}`, step.time, ...(step.state && painter ? painter.facts(step) : [])])
    .filter(Boolean).map(text => el('span', 'chip', text)));
  drawNotes(step);
  drawLog(steps);
}

// What the run has used: tokens, what they would cost through the API, and how full the
// subscription's limits were at the start and the end of the run.
function usageChips(usage) {
  if (!usage) return [];
  const { fresh, cached, stored, output } = usage.tokens, all = fresh + cached + stored + output;
  if (!all) return [];
  const percent = share => Math.round(share * 100) + '%';
  const limit = (label, range) => range && `${label} ${range[0] === range[1] ? percent(range[0]) : percent(range[0]) + ' → ' + percent(range[1])}`;
  return [`${short(all)} tokens, ${percent(cached / all)} from cache`, `${short(output)} written by the agent`,
          usage.cost && `about $${usage.cost.toFixed(2)} at API prices`,
          limit('5-hour limit', usage.five_hour), limit('weekly limit', usage.seven_day)]
    .filter(Boolean).map(text => el('span', 'chip', text));
}

// Worlds that have notes lying around get a button on the drawing; it opens a panel to read them.
let notesShown = '';   // so the panel is only rebuilt (and scrolled up) when the notes change
function drawNotes(step) {
  const notes = step?.state && painter?.notes ? painter.notes(step) : null;
  $('notesButton').hidden = !notes;
  $('notes').hidden = !notes || !notesOpen;
  if (!notes) return;
  $('notesButton').textContent = `${notesOpen ? '✕' : '✎'} ${notes.length} note${notes.length === 1 ? '' : 's'}`;
  if (!notesOpen || notesShown === JSON.stringify(notes)) return;
  notesShown = JSON.stringify(notes);
  $('notes').replaceChildren(...(notes.length ? notes.map(note =>
    el('div', 'note', el('div', 'where', note.where), el('div', 'text', note.text)))
    : [el('div', 'note', 'No notes in the world at this step.')]));
}

// The box under the conversation. For a new run it starts the run; for a run that is
// going it sends the next message. A finished run has none.
function drawComposer() {
  const live = !draft && story && !story.done;
  const acting = live && !story.waiting;
  $('composer').hidden = !draft && !live;
  $('state').replaceChildren(...[...(draft ? ['New run']
    : !live ? ['Conversation']
    : story.queued ? [el('i', 'dot'), 'Your message goes out when the agent stops']
    : acting ? [el('i', 'dot'), 'The agent is acting…'] : ['The agent has stopped and waits']),
    live && story.until && el('span', 'chip', `ends ${story.until}`),
    // how big the agent's conversation is at the step on screen: what it re-reads for every answer
    !draft && memoryAt() && el('span', 'chip', `${short(memoryAt())} tokens in memory`)].filter(Boolean));
  // While the agent acts, the button is a stop square that ends the run; Enter still sends.
  $('send').textContent = draft ? 'Start' : acting ? '■' : '↑';
  $('send').type = acting ? 'button' : 'submit';
  $('send').title = draft ? 'Start the run' : acting ? 'End run' : 'Send';
  $('send').classList.toggle('square', acting);
  $('stop').hidden = draft || acting;   // while the agent waits, ending the run is a quiet link
  if (live) $('auto').checked = story.auto;
  if (live && story.keep && document.activeElement !== $('keep')) $('keep').value = story.keep;
  $('limit').hidden = !$('auto').checked;   // how it is kept going only matters while it is
  // A new run suggests what the last one was told first. Later the field is for whatever
  // you want to say; sent empty, it gives the agent one nudge with the keep-going message.
  $('say').placeholder = draft ? 'What the agent is told first' : 'Tell the agent something, or send empty to nudge it';
  if (draft && !$('say').value && document.activeElement !== $('say')) $('say').value = lastPrompt || '';
}

// The size of the agent's conversation at the step on screen (the last one known up to there).
function memoryAt() {
  const steps = story?.steps || [];
  for (let i = Math.min(at, steps.length - 1); i >= 0 && steps[i].kind !== 'death'; i--)
    if (steps[i].memory) return steps[i].memory;
  // At the very start of a life nothing is known yet: take what the agent read for its first answer.
  return steps.slice(at).find(step => step.memory)?.memory || 0;
}

// An empty conversation has room for the two choices a new run needs: which world, which agent.
function choices() {
  const pick = (kind, options) => el('div', 'choice', ...options.map(([name, label]) => {
    const button = el('button', name === chosen[kind] ? 'on' : '', label);
    button.onclick = () => { chosen[kind] = name; draw(); $('say').focus(); };
    return button;
  }));
  return el('div', 'empty',
    'Which world?', pick('world', worlds.map(world => [world.name, world.title])),
    'Which agent?', pick('agent', agents.map(name => [name, name])),
    'Write below what it is told, and start.');
}

async function newRun() {
  draft = true;
  playing = false;
  $('say').value = '';
  $('auto').checked = false;
  $('minutes').value = '';
  await listRuns();
  draw();
  $('say').focus();
  $('say').select();
}

function drawLog(steps) {
  const labels = { prompt: 'Agent is told', think: 'Agent thinks', say: 'Agent says', act: 'Agent does' };
  let round = 0;
  $('log').replaceChildren(...steps.map((step, i) => {
    const row = el('div', `step ${step.kind}` + (i === at ? ' now' : ''));
    const told = { 'by hand': 'You tell the agent', auto: 'Kept going', repeat: 'Prompt repeated', 'new life': 'New agent is told' }[step.how];
    const count = step.kind === 'prompt' ? `Round ${++round} · ` : '';   // every message to the agent opens a round
    if (labels[step.kind]) row.append(el('div', 'label', count + (told || labels[step.kind])));
    if (step.kind === 'act') {
      const args = Object.entries(step.args).map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join(', ');
      row.append(el('div', 'call', `${step.tool}(${args})`));
    }
    row.append(el('div', 'text', step.kind === 'act' ? step.result : step.text));
    row.onclick = () => jump(i);
    return row;
  }));
  // Keep the current step in sight by scrolling the conversation only, never the whole page.
  const box = $('log'), now = box.querySelector('.now');
  if (now && now.offsetTop < box.scrollTop) box.scrollTop = now.offsetTop;
  else if (now && now.offsetTop + now.offsetHeight > box.scrollTop + box.clientHeight)
    box.scrollTop = now.offsetTop + now.offsetHeight - box.clientHeight;
}

function jump(to) {
  at = Math.max(0, Math.min(to, story.steps.length - 1));
  playing = false;
  draw();
}

// ---------------------------------------------------------------- buttons

$('play').onclick = () => {
  if (!story || draft) return;
  if (!playing && story.done && at >= story.steps.length - 1) at = 0;  // replay from the start
  playing = !playing;
  draw();
};
$('back').onclick = () => story && !draft && jump(at - 1);
$('forward').onclick = () => story && !draft && jump(at + 1);
$('slider').oninput = e => story && !draft && jump(+e.target.value);
// Steering a run that is going. The next poll shows the effect.
const steer = (action, wish = {}) => api(`/api/runs/${story.id}/${action}`, { method: 'POST', body: JSON.stringify(wish) });
$('composer').onsubmit = async e => {
  e.preventDefault();
  const text = $('say').value;
  $('say').value = '';
  $('say').blur();
  if (!draft) return steer('say', { text: text.trim() || $('keep').value });
  const wish = { world: chosen.world, model: chosen.agent, prompt: text, auto: $('auto').checked, minutes: +$('minutes').value, text: $('keep').value };
  const { id } = await api('/api/runs', { method: 'POST', body: JSON.stringify(wish) });
  if (!id) return;          // a run started this very second already
  await select(id);
  playing = true;           // watch it live
};
// Keeping the agent going: what it is told whenever it stops, and for how long (an empty
// time means no limit; it counts from when it is set). The message is remembered in this browser.
const KEEP = 'It is {day}, {time}.';
try { $('keep').value = localStorage.getItem('keep') || KEEP; } catch { $('keep').value = KEEP; }
const going = () => {
  $('limit').hidden = !$('auto').checked;
  if (!$('keep').value.trim()) $('keep').value = KEEP;
  try { localStorage.setItem('keep', $('keep').value); } catch {}
  if (!draft) steer('auto', { on: $('auto').checked, minutes: +$('minutes').value, text: $('keep').value });
};
$('auto').onchange = $('minutes').onchange = $('keep').onchange = going;
$('keep').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('keep').blur(); } };   // Enter confirms, it does not send
// Enter in the text field always sends. (The browser would not do that by itself while the
// button is the stop square, because the form then has no send button and two fields.)
$('say').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('composer').requestSubmit(); } };
$('stop').onclick = () => steer('stop');
$('send').onclick = () => { if ($('send').type === 'button') steer('stop'); };
$('new').onclick = newRun;
$('notesButton').onclick = () => { notesOpen = !notesOpen; notesShown = ''; draw(); };

// Open on the newest run, or on the one named in the address: #<run id>/<step number>/play
// (#new opens the box for a new run, #<run id>/<step>/about the description of its world,
//  #<run id>/<step>/notes the notes lying in it.)
const [run, step, extra] = location.hash.slice(1).split('/');
if (run === 'new') listRuns().then(newRun);
else loadRuns(run).then(() => {
  if (run && step) jump(step - 1);
  if (extra === 'play') playing = true;
  if (extra === 'about') aboutOpen = true;
  if (extra === 'notes') notesOpen = true;
  if (extra) draw();
});
</script>
</body>
</html>
